openapi: 3.1.0
info:
  title: Microservicio DNI
  description: API para resolver operaciones básicas con DNIs (Documentos
    Nacionales de Identidad) españoles.
  version: 1.0.0
paths:
  /dni/{numero}:
    post:
      summary: Calcula Letra
      operationId: calcula_letra_dni__numero__post
      parameters:
        - name: numero
          in: path
          required: true
          schema:
            type: integer
            title: Numero
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /dni/validar:
    get:
      summary: Valida Dni Completo
      operationId: valida_DNI_completo_dni_validar_get
      parameters:
        - name: dni
          in: query
          required: true
          schema:
            type: string
            title: Dni
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: "#/components/schemas/ValidationError"
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError